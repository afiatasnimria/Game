<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smart Sudoku</title>

<style>
body{
    font-family: Arial, sans-serif;
    text-align:center;
    background:#f5f6fa;
}

h1{
    margin:20px;
}

#board{
    display:grid;
    grid-template-columns:repeat(9,55px);
    width:495px;
    margin:20px auto;
    border:3px solid black;
}

.cell{
    width:55px;
    height:55px;
    text-align:center;
    font-size:24px;
    border:1px solid #bbb;
    outline:none;
}

.fixed{
    background:#dfe6e9;
    font-weight:bold;
}

.selected{
    background:#ffeaa7 !important;
}

.highlight{
    background:#dfefff !important;
}

.correct{
    color:green;
    font-weight:bold;
}

.wrong{
    color:red;
    font-weight:bold;
}

.border-right{
    border-right:3px solid black;
}

.border-bottom{
    border-bottom:3px solid black;
}

button{
    padding:10px 20px;
    font-size:18px;
    cursor:pointer;
    margin:10px;
}
</style>
</head>
<body>

<h1>Smart Sudoku</h1>

<div id="board"></div>

<button onclick="resetGame()">Reset</button>

<script>
const puzzle = [
[5,3,0,0,7,0,0,0,0],
[6,0,0,1,9,5,0,0,0],
[0,9,8,0,0,0,0,6,0],
[8,0,0,0,6,0,0,0,3],
[4,0,0,8,0,3,0,0,1],
[7,0,0,0,2,0,0,0,6],
[0,6,0,0,0,0,2,8,0],
[0,0,0,4,1,9,0,0,5],
[0,0,0,0,8,0,0,7,9]
];

const solution = [
[5,3,4,6,7,8,9,1,2],
[6,7,2,1,9,5,3,4,8],
[1,9,8,3,4,2,5,6,7],
[8,5,9,7,6,1,4,2,3],
[4,2,6,8,5,3,7,9,1],
[7,1,3,9,2,4,8,5,6],
[9,6,1,5,3,7,2,8,4],
[2,8,7,4,1,9,6,3,5],
[3,4,5,2,8,6,1,7,9]
];

const board = document.getElementById("board");

function createBoard(){
    board.innerHTML = "";

    for(let r=0;r<9;r++){
        for(let c=0;c<9;c++){
            const input = document.createElement("input");
            input.classList.add("cell");

            if((c+1)%3===0 && c!==8){
                input.classList.add("border-right");
            }

            if((r+1)%3===0 && r!==8){
                input.classList.add("border-bottom");
            }

            input.dataset.row = r;
            input.dataset.col = c;
            input.maxLength = 1;

            if(puzzle[r][c] !== 0){
                input.value = puzzle[r][c];
                input.disabled = true;
                input.classList.add("fixed");
            }

            input.addEventListener("focus", ()=>{
                highlightCells(r,c,input);
            });

            input.addEventListener("input", (e)=>{
                handleInput(e,input,r,c);
            });

            board.appendChild(input);
        }
    }
}

function handleInput(e,input,r,c){
    let value = e.target.value;

    if(!/^[1-9]$/.test(value)){
        input.value = "";
        input.classList.remove("correct","wrong");
        return;
    }

    if(Number(value) === solution[r][c]){
        input.classList.remove("wrong");
        input.classList.add("correct");
    }else{
        input.classList.remove("correct");
        input.classList.add("wrong");
    }

    checkWin();
}

function highlightCells(row,col,current){
    document.querySelectorAll(".cell").forEach(cell=>{
        cell.classList.remove("selected","highlight");

        let r = Number(cell.dataset.row);
        let c = Number(cell.dataset.col);

        if(r===row || c===col){
            cell.classList.add("highlight");
        }
    });

    current.classList.add("selected");
}

function checkWin(){
    const cells = document.querySelectorAll(".cell");

    for(let cell of cells){
        const r = Number(cell.dataset.row);
        const c = Number(cell.dataset.col);

        if(Number(cell.value) !== solution[r][c]){
            return;
        }
    }

    setTimeout(()=>{
        alert("🎉 You solved the Sudoku!");
    },200);
}

function resetGame(){
    createBoard();
}

createBoard();
</script>

</body>
</html>
