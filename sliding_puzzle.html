<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sliding Puzzle</title>

<style>
body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f4f4f4;
    text-align:center;
}

h1{
    margin-top:20px;
}

#moves{
    font-size:22px;
    margin:15px;
}

#board{
    width:320px;
    height:320px;
    margin:20px auto;
    display:grid;
    grid-template-columns:repeat(3,100px);
    grid-template-rows:repeat(3,100px);
    gap:10px;
}

.tile{
    background:#2563eb;
    color:white;
    font-size:32px;
    display:flex;
    justify-content:center;
    align-items:center;
    border-radius:12px;
    cursor:pointer;
    user-select:none;
    transition:.2s;
}

.tile:hover{
    transform:scale(1.05);
}

.empty{
    background:transparent;
    cursor:default;
}
button{
    padding:10px 20px;
    font-size:18px;
    cursor:pointer;
}
</style>
</head>
<body>

<h1>Sliding Puzzle</h1>
<div id="moves">Moves: 0</div>

<div id="board"></div>

<button onclick="startGame()">Shuffle</button>

<script>
let board = [1,2,3,4,5,6,7,8,0];
let moves = 0;

function shuffle(array){
    for(let i=array.length-1;i>0;i--){
        let j=Math.floor(Math.random()*(i+1));
        [array[i],array[j]]=[array[j],array[i]];
    }
}

function render(){
    const boardDiv = document.getElementById("board");
    boardDiv.innerHTML="";

    board.forEach((num,index)=>{
        const tile=document.createElement("div");

        if(num===0){
            tile.classList.add("tile","empty");
        }else{
            tile.classList.add("tile");
            tile.innerText=num;
            tile.onclick=()=>moveTile(index);
        }

        boardDiv.appendChild(tile);
    });

    document.getElementById("moves").innerText =
        "Moves: " + moves;
}

function moveTile(index){
    const emptyIndex = board.indexOf(0);

    const validMoves = [
        emptyIndex-1,
        emptyIndex+1,
        emptyIndex-3,
        emptyIndex+3
    ];

    if(validMoves.includes(index)){
        [board[index],board[emptyIndex]] =
        [board[emptyIndex],board[index]];

        moves++;
        render();
        checkWin();
    }
}

function checkWin(){
    const solved = [1,2,3,4,5,6,7,8,0];

    if(board.join()===solved.join()){
        setTimeout(()=>{
            alert("🎉 Puzzle Solved in " + moves + " moves!");
        },200);
    }
}

function startGame(){
    shuffle(board);
    moves = 0;
    render();
}

render();
</script>

</body>
</html>
