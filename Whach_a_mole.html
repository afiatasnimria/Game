<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Whack-a-Mole</title>

<style>
body{
    margin:0;
    font-family:Arial,sans-serif;
    background:linear-gradient(to right,#56ab2f,#a8e063);
    text-align:center;
    color:white;
}

h1{
    margin-top:20px;
}

#scoreboard{
    font-size:24px;
    margin:20px;
}

.grid{
    width:420px;
    margin:20px auto;
    display:grid;
    grid-template-columns:repeat(3,120px);
    gap:20px;
}

.hole{
    width:120px;
    height:120px;
    background:#5c4033;
    border-radius:50%;
    position:relative;
    cursor:pointer;
    overflow:hidden;
}

.mole{
    width:80px;
    height:80px;
    background:brown;
    border-radius:50%;
    position:absolute;
    bottom:-100px;
    left:20px;
    transition:0.2s;
}

.up .mole{
    bottom:20px;
}

button{
    padding:10px 20px;
    font-size:18px;
    cursor:pointer;
    border:none;
    border-radius:8px;
}
</style>
</head>
<body>

<h1>Whack-a-Mole</h1>

<div id="scoreboard">
    Score: <span id="score">0</span> |
    Time: <span id="time">30</span>
</div>

<div class="grid" id="grid"></div>

<button onclick="startGame()">Restart</button>

<script>
const grid = document.getElementById("grid");
const scoreDisplay = document.getElementById("score");
const timeDisplay = document.getElementById("time");

let score = 0;
let timeLeft = 30;
let currentHole = null;
let timer;
let moleTimer;

for(let i=0;i<9;i++){
    const hole = document.createElement("div");
    hole.classList.add("hole");

    const mole = document.createElement("div");
    mole.classList.add("mole");

    hole.appendChild(mole);
    grid.appendChild(hole);

    hole.addEventListener("click",()=>{
        if(hole === currentHole){
            score++;
            scoreDisplay.innerText = score;
            hole.classList.remove("up");
            currentHole = null;
        }
    });
}

function randomHole(){
    const holes = document.querySelectorAll(".hole");

    if(currentHole){
        currentHole.classList.remove("up");
    }

    const randomIndex = Math.floor(Math.random()*holes.length);
    currentHole = holes[randomIndex];
    currentHole.classList.add("up");
}

function startGame(){
    score = 0;
    timeLeft = 30;

    scoreDisplay.innerText = score;
    timeDisplay.innerText = timeLeft;

    clearInterval(timer);
    clearInterval(moleTimer);

    moleTimer = setInterval(randomHole, 700);

    timer = setInterval(()=>{
        timeLeft--;
        timeDisplay.innerText = timeLeft;

        if(timeLeft <= 0){
            clearInterval(timer);
            clearInterval(moleTimer);

            if(currentHole){
                currentHole.classList.remove("up");
            }

            alert("Game Over! Score: " + score);
        }
    },1000);
}

startGame();
</script>

</body>
</html>
